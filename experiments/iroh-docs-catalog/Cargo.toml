[package]
name = "iroh-docs-catalog-qualification"
version = "0.0.0"
edition = "2024"
publish = false

# This qualification has its own dependency graph. It is not a Core feature.
[workspace]

[dependencies]
anyhow = "1"
bytes = "1"
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-docs = { version = "=0.101.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[patch.crates-io]
iroh = { path = "../../vendor/iroh" }
netlink-packet-core = { path = "../../vendor/netlink-packet-core" }

[profile.dev]
debug = 0
incremental = false
