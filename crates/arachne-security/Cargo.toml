[package]
name = "arachne-security"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "MLS-based workspace membership, invitations, and protected messages for Arachne."
keywords = ["cryptography", "groups", "mls", "security"]
documentation = "https://docs.rs/arachne-security"
readme = "README.md"
publish = ["crates-io"]

[dependencies]
openmls = "0.9.0"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
# Keep one AES-GCM generation with openmls_rust_crypto 0.6 and Iroh/Noq.
aes-gcm = "0.10.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
zeroize = "1.9.0"
# Use the existing ring backend; rust-crypto would add AES-GCM 0.11.
sframe = { version = "2.0.0", default-features = false, features = ["ring"] }
