[package]
name = "arachne-delivery"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded publication retention and authorized message-history recovery for Arachne."
documentation = "https://docs.rs/arachne-delivery"
readme = "README.md"
publish = false

[dependencies]
arachne-routing = { path = "../arachne-routing", version = "0.1.0" }
arachne-security = { path = "../arachne-security", version = "0.1.0" }
sha2 = "=0.10.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
