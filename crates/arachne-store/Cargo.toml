[package]
name = "arachne-store"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Encrypted SQLite storage for Arachne workspace records."
keywords = ["database", "encryption", "sqlite", "storage"]
documentation = "https://docs.rs/arachne-store"
readme = "README.md"
publish = ["crates-io"]

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
# Keep one AES-GCM generation with openmls_rust_crypto 0.6 and Iroh/Noq.
aes-gcm = "0.10.3"
hkdf = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
zeroize = "1.9.0"

[dev-dependencies]
arachne-security = { path = "../arachne-security", version = "0.1.0" }
tempfile = "3.27.0"
