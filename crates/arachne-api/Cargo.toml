[package]
name = "arachne-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public contract types for Arachne: ID newtypes, stable error codes, events and capabilities."
keywords = ["api-bindings", "p2p", "networking"]
documentation = "https://docs.rs/arachne-api"
publish = ["crates-io"]

# TODO(ADR A1/A4 step 7): add an optional `uniffi` feature (UniFFI `=0.31.x`)
# with `cfg_attr(feature = "uniffi", derive(uniffi::Record/Enum/Error))` on the
# public types and `uniffi::setup_scaffolding!()` in lib.rs. Spike
# `#[non_exhaustive]` on `uniffi::Enum`/`uniffi::Error` first.
[features]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
serde_json = "1.0.151"
