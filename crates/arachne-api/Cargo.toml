[package]
name = "arachne-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public contract types for Arachne: ID newtypes, stable error codes, events and capabilities."
keywords = ["api-bindings", "p2p", "networking"]
documentation = "https://docs.rs/arachne-api"
publish = ["crates-io"]

# Matches the supported SDK binding generator. Core has no FFI dependency by default.
[features]
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uniffi = { version = "=0.31.2", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
