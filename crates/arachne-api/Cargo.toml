[package]
name = "arachne-api"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public contract types for Arachne: ID newtypes, stable error codes, events and capabilities."
keywords = ["api-bindings", "p2p", "networking"]
documentation = "https://docs.rs/arachne-api"
publish = ["crates-io"]

# ADR A1/A4 step 7 (spike/a1-uniffi): optional UniFFI derives. Pinned to the
# UniFFI minor that uniffi-bindgen-go v0.7.1 supports (0.31). See
# docs/reviews/spike-a1-uniffi.md.
[features]
uniffi = ["dep:uniffi"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uniffi = { version = "=0.31.2", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
