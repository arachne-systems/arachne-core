[package]
name = "arachne-node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Iroh-based peer connectivity and bounded data transport for Arachne."
keywords = ["iroh", "networking", "p2p", "transport"]
documentation = "https://docs.rs/arachne-node"
readme = "README.md"
publish = ["crates-io"]

[features]
tor = ["dep:iroh-tor-transport", "iroh/unstable-custom-transports"]

[dependencies]
bytes = "1.12.1"
getrandom = "0.4.3"
futures-util = "0.3.34"
arachne-routing = { path = "../arachne-routing", version = "0.1.0" }
# Exact pin: the `tor` feature enables `iroh/unstable-custom-transports`, an API
# that iroh excludes from its semver guarantees. The vendored gossip/blobs forks
# are also only qualified against this iroh release. Bump deliberately.
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "metrics"] }
# Exact pin: built on the same unstable iroh custom-transport API as above.
iroh-tor-transport = { version = "=0.1.0", optional = true }
# Exact pins: renamed Arachne forks whose patched source must match this crate.
iroh-blobs = { package = "arachne-iroh-blobs", path = "../../vendor/iroh-blobs", version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { package = "arachne-iroh-gossip", path = "../../vendor/iroh-gossip", version = "=0.101.0", default-features = false, features = ["net"] }
iroh-mdns-address-lookup = { version = "0.5.0", default-features = false }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
tempfile = "3.27.0"
arachne-security = { path = "../arachne-security", version = "0.1.0" }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
