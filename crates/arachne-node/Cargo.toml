[package]
name = "arachne-node"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Iroh-based peer connectivity and bounded data transport for Arachne."
documentation = "https://docs.rs/arachne-node"
readme = "README.md"
publish = false

[dependencies]
bytes = "1"
getrandom = "=0.4.3"
futures-util = "=0.3.34"
arachne-routing = { path = "../arachne-routing", version = "0.1.0" }
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "metrics"] }
iroh-blobs = { version = "=0.103.0", default-features = false, features = ["fs-store"] }
iroh-gossip = { version = "=0.101.0", default-features = false, features = ["net"] }
iroh-mdns-address-lookup = { version = "=0.5.0", default-features = false }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
arachne-security = { path = "../arachne-security" }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
