[package]
name = "arachne-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed Rust client API for Arachne secure peer-to-peer workspaces."
keywords = ["api-bindings", "mls", "networking", "p2p"]
documentation = "https://docs.rs/arachne-runtime"
readme = "README.md"
publish = ["crates-io"]

[features]
default = []
uniffi = ["dep:uniffi", "arachne-api/uniffi"]
test-fixtures = []
debug-rig = []
moq = ["arachne-node/moq"]
tor = ["arachne-node/tor"]

[dependencies]
uniffi = { version = "=0.31.2", optional = true }
arachne-api = { path = "../arachne-api", version = "0.1.0" }
arachne-delivery = { path = "../arachne-delivery", version = "0.1.0" }
arachne-routing = { path = "../arachne-routing", version = "0.1.0" }
arachne-security = { path = "../arachne-security", version = "0.1.0" }
arachne-node = { path = "../arachne-node", version = "0.1.0" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

arachne-store = { path = "../arachne-store", version = "0.1.0" }
getrandom = "0.4.3"
zeroize = "1.9.0"

[dev-dependencies]
base64 = "0.22.1"
# Exact pin: must match arachne-node's iroh pin (unstable custom-transport API).
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "metrics", "test-utils"] }
# Test only: edits a store file header as a later build would.
rusqlite = "0.40.2"
tempfile = "3.27.0"

[[test]]
name = "admission_capacity"
required-features = ["test-fixtures"]

[[test]]
name = "admission_event_driven"
required-features = ["test-fixtures", "debug-rig"]

[[test]]
name = "admission_staging"
required-features = ["test-fixtures"]

[[test]]
name = "committed_view"
required-features = ["test-fixtures"]

[[test]]
name = "gossip_key"
required-features = ["test-fixtures"]

[[test]]
name = "interest_progress"
required-features = ["test-fixtures"]

[[test]]
name = "invitation_link_capacity"
required-features = ["test-fixtures"]

[[test]]
name = "native_persistence"
required-features = ["test-fixtures"]

[[test]]
name = "record_bounds"
required-features = ["test-fixtures"]

[[test]]
name = "removed_membership"
required-features = ["test-fixtures"]

[[test]]
name = "returning_member"
required-features = ["test-fixtures"]

[[test]]
name = "workspace_name"
required-features = ["test-fixtures"]

[[example]]
name = "typed_pubsub"
required-features = ["test-fixtures"]

[[example]]
name = "real-iroh-qualification"
required-features = ["test-fixtures"]
