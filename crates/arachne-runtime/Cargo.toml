[package]
name = "arachne-runtime"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
publish = false

[dependencies]
arachne-delivery = { path = "../arachne-delivery" }
arachne-routing = { path = "../arachne-routing" }
arachne-security = { path = "../arachne-security" }
arachne-node = { path = "../arachne-node" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
sha2 = "=0.10.9"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"

arachne-store = { path = "../arachne-store" }
getrandom = "0.2"
zeroize = "1"

[dev-dependencies]
base64 = "0.22"
tempfile = "=3.27.0"
