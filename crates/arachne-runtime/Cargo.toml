[package]
name = "arachne-runtime"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed Rust client API for Arachne secure peer-to-peer workspaces."
keywords = ["api-bindings", "mls", "networking", "p2p"]
documentation = "https://docs.rs/arachne-runtime"
readme = "README.md"
publish = ["crates-io"]

[features]
default = []
moq = ["arachne-node/moq"]
tor = ["arachne-node/tor"]

[dependencies]
arachne-api = { path = "../arachne-api", version = "0.1.0" }
arachne-delivery = { path = "../arachne-delivery", version = "0.1.0" }
arachne-routing = { path = "../arachne-routing", version = "0.1.0" }
arachne-security = { path = "../arachne-security", version = "0.1.0" }
arachne-node = { path = "../arachne-node", version = "0.1.0" }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
sha2 = "0.10.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1.44"

arachne-store = { path = "../arachne-store", version = "0.1.0" }
getrandom = "0.4.3"
zeroize = "1.9.0"

[dev-dependencies]
base64 = "0.22.1"
# Exact pin: must match arachne-node's iroh pin (unstable custom-transport API).
iroh = { version = "=1.2.0", default-features = false, features = ["tls-ring", "metrics", "test-utils"] }
tempfile = "3.27.0"
