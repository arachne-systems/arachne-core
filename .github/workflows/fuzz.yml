name: Fuzz smoke

on:
  pull_request:
    paths:
      - "crates/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  push:
    branches: [main, integrate/wave1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}-${{ matrix.target }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: security_decoders
            max_len: 2097152
          - target: delivery_wire
            max_len: 131072
          - target: persistence_decoders
            max_len: 524288
          - target: runtime_requests
            max_len: 131072
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: nightly-2026-07-29
      - run: cargo install cargo-fuzz --locked --version 0.12.0
      - run: >-
          cargo fuzz run ${{ matrix.target }}
          fuzz/corpus/${{ matrix.target }}
          -- -runs=1000 -max_total_time=30 -max_len=${{ matrix.max_len }}
